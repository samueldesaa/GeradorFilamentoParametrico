<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gerador paramétrico para impressão 3D.">
  <meta name="theme-color" content="#101810">
  <title>Gerador paramétrico para impressão 3D</title>
</head>
<body>
  <div class="shell">
    <header class="toolbar">
      <h1>Gerador paramétrico para impressão 3D</h1>
      <nav class="accessibility" aria-label="Acessibilidade">
        <button type="button" id="themeToggle" aria-pressed="false">Tema claro</button>
        <button type="button" id="fontDown" aria-label="Diminuir tamanho do texto">A−</button>
        <button type="button" id="fontUp" aria-label="Aumentar tamanho do texto">A+</button>
      </nav>
    </header>
    <main class="workspace">
      <form class="controls" id="settingsForm" aria-label="Parâmetros da peça">
        <fieldset class="field-group"><legend>Formato</legend>
          <div class="profile-grid" role="group" aria-label="Formato do caminho">
            <button class="profile" type="button" data-shape="round" aria-pressed="true">Redonda</button>
            <button class="profile" type="button" data-shape="square" aria-pressed="false">Quadrada</button>
            <button class="profile" type="button" data-shape="snake" aria-pressed="false">Cobrinha</button>
          </div>
        </fieldset>
        <div class="field"><label for="length">Comprimento desejado</label><div class="control-wrap"><input id="length" name="length" type="number" min="0.1" max="200" step="0.1" value="10" required inputmode="decimal"><span class="unit">m</span></div></div>
        <div class="field"><label for="bedW">Mesa de impressão (mm)</label><div class="bed-inputs"><div class="control-wrap"><input id="bedW" name="bedW" type="number" min="50" max="500" step="5" value="220" required aria-label="Largura útil da mesa em milímetros"><span class="unit">×</span></div><div class="control-wrap"><input id="bedH" name="bedH" type="number" min="50" max="500" step="5" value="220" required aria-label="Profundidade útil da mesa em milímetros"><span class="unit">mm</span></div></div></div>
        <div class="field"><label for="edgeMargin">Distância da borda (mm)</label><div class="control-wrap"><input id="edgeMargin" name="edgeMargin" type="number" min="0" max="50" step="1" value="0" required inputmode="decimal"><span class="unit">mm</span></div></div>
        <div class="field"><label for="centerOffset">Espaço livre no centro (m)</label><div class="control-wrap"><input id="centerOffset" name="centerOffset" type="number" min="0" max="200" step="0.1" value="0" required inputmode="decimal"><span class="unit">m</span></div></div>
        <div class="field diameter-note"><span>Diâmetro do filamento</span><strong>1,75 mm</strong></div>
        <div class="field"><label for="rounding">Arredondamento dos cantos <output id="roundingOut" for="rounding">55%</output></label><input id="rounding" name="rounding" type="range" min="0" max="100" step="1" value="55"></div>
        <div class="field"><label for="spacing">Folga entre voltas (mm)</label><div class="control-wrap"><input id="spacing" name="spacing" type="number" min="0.2" max="8" step="0.2" value="1.2" required inputmode="decimal"><span class="unit">mm</span></div></div>
        <div class="summary" aria-label="Estimativas"><div><span>Comprimento</span><strong id="pathLength">—</strong></div><div><span>Área ocupada</span><strong id="footprint">—</strong></div></div>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
        <button class="primary" id="buildBtn" type="button">Pré-visualizar</button>
      </form>
      <section class="preview" aria-label="Pré-visualização da peça">
        <div class="preview-head"><strong id="previewTitle">Caminho 2D</strong><span id="plateLabel">220 × 220 mm</span><button class="secondary back-button" id="backBtn" type="button" hidden>Voltar aos parâmetros</button><button class="secondary" id="downloadBtn" type="button" disabled hidden>Exportar STL</button></div>
        <div class="canvas-wrap" id="canvasWrap"><canvas id="previewCanvas" aria-label="Caminho 2D na mesa de impressão"></canvas><div id="three-root" aria-label="Pré-visualização tridimensional" hidden></div><div class="empty-overlay" id="previewError"><strong>Não foi possível desenhar o caminho</strong><span id="previewErrorText">Confira os parâmetros.</span></div></div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
